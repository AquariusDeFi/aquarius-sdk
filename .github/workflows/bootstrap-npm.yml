name: Bootstrap npm publish (one-time)

# One-time manual publish of @aquariusdefi/sdk 0.0.1, using a short-lived
# granular token in the NPM_TOKEN secret. npm cannot OIDC-publish a package's
# first version, so this workflow exists only to make the package exist.
#
# Afterwards: revoke the token on npmjs.com, delete the NPM_TOKEN secret,
# configure the trusted publisher, and delete this workflow file.
# Every subsequent release goes through release-javascript.yml, tokenless.

on:
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
      - run: npm install
        working-directory: javascript
      - run: npm publish
        working-directory: javascript
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

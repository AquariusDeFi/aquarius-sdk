name: Release Python

# Publishes python/ to PyPI via Trusted Publishing (OIDC) — no tokens stored anywhere.
# Trigger: push a tag like py-v0.0.1. The tag must match python/pyproject.toml's version.

on:
  push:
    tags: ["py-v*"]

jobs:
  pypi:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check tag matches package version
        run: |
          TAG="${GITHUB_REF_NAME#py-v}"
          VERSION=$(python -c "import tomllib; print(tomllib.load(open('python/pyproject.toml','rb'))['project']['version'])")
          test "$TAG" = "$VERSION" || { echo "tag $TAG != pyproject $VERSION"; exit 1; }
      - run: pip install build
      - run: python -m build python/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: python/dist/

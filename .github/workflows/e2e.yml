name: E2E

on:
  pull_request:
  push:
    branches: [master]
  schedule:
    - cron: "23 3 * * *"
  workflow_dispatch:

jobs:
  # One job, strictly sequential, and a cross-run mutex: concurrent testnet
  # lifecycles trade against each other in the same tiny pools and breach
  # each other's slippage guards (observed between the py and js jobs of a
  # single run).
  testnet:
    # Pull requests are verified offline; public-network writes require a separate run.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    concurrency:
      group: testnet-e2e
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: pip install -e ./python
      - run: python e2e/testnet_lifecycle.py
      - run: npm install
        working-directory: javascript
      - run: npm run build
        working-directory: javascript
      - run: node javascript/e2e/testnet_lifecycle.mjs

  mainnet-readonly-python:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ./python
      - run: python e2e/mainnet_readonly.py

  mainnet-readonly-javascript:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install
        working-directory: javascript
      - run: npm run build
        working-directory: javascript
      - run: node javascript/e2e/mainnet_readonly.mjs

  # Real-fund lifecycles require a manual or scheduled run. Pull requests
  # execute offline and read-only checks without public-network writes.
  mainnet-lifecycle-python:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: mainnet-e2e
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ./python
      - run: python e2e/mainnet_lifecycle.py
        env:
          MAINNET_E2E_SECRET: ${{ secrets.MAINNET_E2E_SECRET }}

  # Runs after the Python lifecycle: both share the wallet, and each starts
  # from the flat state the other leaves behind.
  mainnet-lifecycle-javascript:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    needs: mainnet-lifecycle-python
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: mainnet-e2e
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install
        working-directory: javascript
      - run: npm run build
        working-directory: javascript
      - run: node javascript/e2e/mainnet_lifecycle.mjs
        env:
          MAINNET_E2E_SECRET: ${{ secrets.MAINNET_E2E_SECRET }}

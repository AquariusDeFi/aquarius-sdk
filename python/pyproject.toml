[project]
name = "aquarius-sdk"
version = "0.0.1"
description = "Python SDK for the Aquarius protocol on Stellar"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "stellar-sdk>=13",
    "requests>=2.28",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["aquarius*"]
